[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf-redpen"
version = "0.1.1"
description = "Ground quotes from an LLM review to real PDF coordinates and mark them as standard highlight + note annotations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LeeGyeongPil" }]
keywords = ["pdf", "annotation", "highlight", "llm", "review", "grounding"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Text Processing",
]
dependencies = [
  "pdfplumber==0.11.10",
  "pypdf==7.0.0",
  "pillow>=13.0.0",
]

[project.scripts]
pdf-redpen = "pdf_redpen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_redpen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest==9.2.0"]
